name: Diagnostics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up CMake and C++
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: JavaScript syntax check
        run: npm run check
      - name: JavaScript unit tests
        run: npm test
      - name: Build native utility
        run: cmake -S native/cpp -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Compile native smoke test
        run: c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror native/cpp/signal_summary.cpp native/cpp/signal_summary_test.cpp -o build/native/signal_summary_test
      - name: Run native smoke test
        run: ./build/native/signal_summary_test
